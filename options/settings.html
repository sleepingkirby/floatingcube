<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8"/>
    <link id="cssPath" rel="stylesheet" href="./settings.css"/>

    <div class="pageWrap">
      <div id="msgPrfl">&nbsp;</div>
      <div id="prflSlct">

      <div id="prflTxt">
        <textarea id="prflJSON" placeholder="No profile code"></textarea>
      </div>
    </div>
  
    <script src="./options.js"></script>
